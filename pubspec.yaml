name: maatriwatch
description: MaatriWatch — AI-powered maternal health monitoring by Team CodeBlooded

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  firebase_database: ^10.4.9
  firebase_messaging: ^14.7.19

  # Notifications
  flutter_local_notifications: ^16.3.0

  # State management
  provider: ^6.1.1

  # Charts
  fl_chart: ^0.66.2

  # Fonts
  google_fonts: ^6.1.0

  # Networking
  http: ^1.2.0

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  flutter_animate: ^4.5.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/mother_child_silhouette.png
    - assets/images/maatriwatch_logo.png
